server:
  port: 18080

spring:
  application:
    name: zl-volt-demo
  datasource:
    url: jdbc:h2:mem:zlvolt;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,USER,KEY,PERIOD,OPERATOR,LEVEL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

zl:
  demo:
    reset-on-start: true
  mqtt:
    enabled: true
    port: 1884

logging:
  level:
    root: info
    com.zlvolt: info
    io.moquette: warn
