# ZL-Volt 开发环境中间件
# 使用：
#   轻量模式：docker compose -f deploy/docker-compose-dev.yml up -d
#   完整模式：docker compose -f deploy/docker-compose-dev.yml --profile full up -d
# 说明：
#   - 仅用于本地开发/测试，生产请使用 K8s + 独立高可用部署。
#   - 所有账号密码均为开发默认值，禁止用于生产。

name: zl-volt-dev

services:
  mysql:
    image: mysql:8.0.36
    container_name: zl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: zl_system
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --lower_case_table_names=1
    ports:
      - "3306:3306"
    volumes:
      - zl-mysql-data:/var/lib/mysql
      - ../db/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - zl-net

  redis:
    image: redis:7.2-alpine
    container_name: zl-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - zl-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - zl-net

  zookeeper:
    image: zookeeper:3.8
    container_name: zl-zookeeper
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"
      ZOO_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zl-zk-data:/data
      - zl-zk-datalog:/datalog
    networks:
      - zl-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: zl-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - zl-rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - zl-net

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: zl-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - zl-rocketmq-broker-logs:/home/rocketmq/logs
      - zl-rocketmq-store:/home/rocketmq/store
    networks:
      - zl-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: zl-rocketmq-dashboard
    depends_on:
      - rocketmq-namesrv
    ports:
      - "8180:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    networks:
      - zl-net

  emqx:
    image: emqx/emqx:5.6.1
    container_name: zl-emqx
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
      EMQX_LOG__CONSOLE__LEVEL: warning
    volumes:
      - zl-emqx-data:/opt/emqx/data
      - zl-emqx-log:/opt/emqx/log
    networks:
      - zl-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: zl-kafka
    profiles: ["full"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - zl-kafka-data:/var/lib/kafka/data
    networks:
      - zl-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: zl-elasticsearch
    profiles: ["full"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - zl-es-data:/usr/share/elasticsearch/data
    networks:
      - zl-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: zl-kibana
    profiles: ["full"]
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - zl-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: zl-clickhouse
    profiles: ["full"]
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - zl-clickhouse-data:/var/lib/clickhouse
      - ../db/clickhouse:/docker-entrypoint-initdb.d:ro
    networks:
      - zl-net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: zl-minio
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - zl-minio-data:/data
    networks:
      - zl-net

volumes:
  zl-mysql-data:
  zl-redis-data:
  zl-zk-data:
  zl-zk-datalog:
  zl-rocketmq-namesrv-logs:
  zl-rocketmq-broker-logs:
  zl-rocketmq-store:
  zl-emqx-data:
  zl-emqx-log:
  zl-kafka-data:
  zl-es-data:
  zl-clickhouse-data:
  zl-minio-data:

networks:
  zl-net:
    driver: bridge
